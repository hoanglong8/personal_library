name: backup-and-export

# Two outputs, two destinations — see scripts/backup-export.mjs for why:
# - dist/backup.sql (full public-schema dump, has reader user_ids) -> a
#   SEPARATE PRIVATE repo (hoanglong8/personal_library-backups).
# - dist/<slug>.md (published book content only, no personal data) ->
#   a public GitHub Release ("book-exports" tag) on THIS repo.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL     — Postgres connection string (Project Settings ->
#                          Database -> Connection string -> URI -> Session
#                          mode/port 5432, NOT the Transaction pooler).
#   BACKUP_REPO_TOKEN    — fine-grained PAT scoped to ONLY the private
#                          backups repo, Contents: Read and write.
# NEXT_PUBLIC_SUPABASE_URL/ANON_KEY are not secret (same values shipped in
# every page's client bundle already) — hardcoded below rather than
# requiring 2 more secrets for no security benefit.

on:
  schedule:
    - cron: "17 19 * * *" # ~02:17 ICT daily — off-peak, arbitrary minute to avoid GitHub's on-the-hour cron congestion
  workflow_dispatch:

permissions:
  contents: write # needed to create a Release on this repo

env:
  NEXT_PUBLIC_SUPABASE_URL: https://lamaeusnlxnlcfahtube.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbWFldXNubHhubGNmYWh0dWJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDAyNTAsImV4cCI6MjEwMTUxNjI1MH0.vlplEFRyE3bAf3zq6ocTYxybIph2Tsd3c290vpaD_qs

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install postgresql-client (pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup + export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup-export.mjs

      - name: Push backup.sql to private backup repo
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/hoanglong8/personal_library-backups.git backup-repo
          mkdir -p backup-repo/backups
          cp dist/backup.sql "backup-repo/backups/backup-$(date -u +%Y-%m-%dT%H-%M-%SZ).sql"
          cd backup-repo
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Không có thay đổi để commit"
          git push

      - name: Publish .md exports as a public Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete book-exports --yes --cleanup-tag 2>/dev/null || true
          gh release create book-exports dist/*.md \
            --title "Book exports (rolling)" \
            --notes "Tự động cập nhật mỗi lần workflow backup-and-export chạy. Không chứa dữ liệu cá nhân người đọc." \
            --repo hoanglong8/personal_library
